<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Reader Logs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg:#0b0f19; --card:#151b2e; --primary:#ff4655; --text:#fff; --muted:#94a3b8; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
    body { background:var(--bg); color:var(--text); padding:20px; min-height:100vh; }
    .panel { max-width:680px; margin:0 auto; }
    .card { background:var(--card); border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:20px; margin-bottom:20px; }
    h2 { font-size:1.15rem; margin-bottom:12px; display:flex; align-items:center; gap:8px; font-family:'Space Grotesk',sans-serif; }
    .log-item { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); padding:12px 16px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
    .badge-social { font-size:0.75rem; padding:4px 10px; border-radius:8px; font-weight:700; }
    .badge-google { background:rgba(234, 67, 53, 0.15); color:#f87171; border:1px solid rgba(234, 67, 53, 0.3); }
    .badge-facebook { background:rgba(24, 119, 242, 0.15); color:#60a5fa; border:1px solid rgba(24, 119, 242, 0.3); }
    .badge-twitter { background:rgba(255,255,255,0.1); color:#fff; }
    #lockScreen { position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
    input { width:100%; padding:12px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#fff; margin-bottom:12px; outline:none; font-size:15px; }
    button { background:var(--primary); color:#fff; border:none; padding:12px 18px; border-radius:10px; font-weight:700; cursor:pointer; width:100%; }
  </style>
</head>
<body>

  <!-- ADMIN PASS -->
  <div id="lockScreen">
    <div class="card" style="width:100%; max-width:340px; text-align:center;">
      <i class="fa-solid fa-lock" style="font-size:2.2rem; color:var(--primary); margin-bottom:12px;"></i>
      <h3>Admin Dashboard</h3>
      <p style="color:var(--muted); font-size:0.85rem; margin:8px 0 16px;">Admin Passkey daalkar unlock karein:</p>
      <input type="password" id="adminPin" placeholder="Admin Password" style="text-align:center;">
      <button onclick="unlockAdmin()">Unlock Logs</button>
      <div id="pinErr" style="color:#f87171; font-size:0.8rem; margin-top:10px;"></div>
    </div>
  </div>

  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2><i class="fa-solid fa-users" style="color:var(--primary)"></i> Live Active Readers Tracker</h2>
      <a href="index.html" style="color:var(--muted); text-decoration:none; font-size:0.85rem;"><i class="fa-solid fa-house"></i> Home</a>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <span>Kaun kab login kar raha hai:</span>
        <button style="width:auto; padding:6px 14px; font-size:0.8rem; background:#334155;" onclick="loadLogs()"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </div>
      <div id="logsContainer">Loading logs...</div>
    </div>
  </div>

  <script>
    const MASTER_PIN = "BLACK@7870ANIX";
    const BIN_ID = "66e0c42dac6210605a222bbe";
    const API_KEY = "$2a$10$1svCQTW76g8kNCCKZHz2je6cHYOHPLEgi1VH//Cs/azPSdvnDW35m";

    function unlockAdmin() {
      const pin = document.getElementById('adminPin').value.trim();
      if (pin === MASTER_PIN) {
        document.getElementById('lockScreen').style.display = 'none';
        loadLogs();
      } else {
        document.getElementById('pinErr').textContent = "Galat Password!";
      }
    }

    async function loadLogs() {
      const container = document.getElementById('logsContainer');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${Date.now()}`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const json = await res.json();
        const logs = (json.record && json.record.logins) ? json.record.logins : [];

        if (logs.length === 0) {
          container.innerHTML = '<div style="color:var(--muted); font-size:0.85rem;">Abhi koi live reader nahi hai.</div>';
          return;
        }

        container.innerHTML = logs.map(l => `
          <div class="log-item">
            <div>
              <strong>${l.name}</strong><br>
              <span style="color:var(--muted); font-size:0.75rem;">${l.date} at ${l.time}</span>
            </div>
            <span class="badge-social ${l.method.includes('Google') ? 'badge-google' : l.method.includes('Facebook') ? 'badge-facebook' : 'badge-twitter'}">
              ${l.method}
            </span>
          </div>
        `).join('');

      } catch (e) {
        container.innerHTML = '<div style="color:#f87171;">Logs load nahi ho sake.</div>';
      }
    }
  </script>
</body>
</html>

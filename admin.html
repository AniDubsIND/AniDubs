<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - AniDubs</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg:#0b0f19; --card:#151b2e; --primary:#ff4655; --text:#fff; --muted:#94a3b8; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
    body { background:var(--bg); color:var(--text); padding:20px; min-height:100vh; }
    .panel { max-width:680px; margin:0 auto; }
    .card { background:var(--card); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:20px; margin-bottom:20px; }
    h2 { font-size:1.2rem; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    input { width:100%; padding:12px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#fff; margin-bottom:12px; outline:none; }
    button { background:var(--primary); color:#fff; border:none; padding:12px 18px; border-radius:10px; font-weight:700; cursor:pointer; width:100%; }
    .user-list { list-style:none; }
    .user-item { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); padding:14px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:10px; }
    .badge { font-size:0.7rem; padding:3px 8px; border-radius:6px; margin-top:4px; display:inline-block; font-weight:600; }
    .badge-locked { background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.3); }
    .badge-unlocked { background:rgba(56,189,248,0.15); color:#38bdf8; border:1px solid rgba(56,189,248,0.3); }
    .del-btn { background:#dc2626; padding:8px 12px; font-size:0.75rem; border-radius:8px; width:auto; }
    .reset-btn { background:#2563eb; padding:8px 12px; font-size:0.75rem; border-radius:8px; width:auto; }
    #lockScreen { position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  </style>
</head>
<body>

  <!-- MASTER PIN SCREEN -->
  <div id="lockScreen">
    <div class="card" style="width:100%; max-width:320px; text-align:center;">
      <i class="fa-solid fa-lock" style="font-size:2.2rem; color:var(--primary); margin-bottom:12px;"></i>
      <h3>Admin Master Lock</h3>
      <p style="color:var(--muted); font-size:0.8rem; margin:8px 0 14px;">Master Admin Password daalein:</p>
      <input type="password" id="masterPin" placeholder="Enter Password" style="text-align:center;" autocomplete="off">
      <button type="button" onclick="unlockAdmin()">Unlock Manager</button>
      <div id="pinErr" style="color:#f87171; font-size:0.75rem; margin-top:8px;"></div>
    </div>
  </div>

  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2><i class="fa-solid fa-sliders" style="color:var(--primary)"></i> Reader Access & Tracker</h2>
      <a href="index.html" style="color:var(--muted); text-decoration:none; font-size:0.85rem;"><i class="fa-solid fa-house"></i> Home</a>
    </div>

    <!-- CREATE USER -->
    <div class="card">
      <h2><i class="fa-solid fa-user-plus" style="color:#38bdf8"></i> Naya Reader Create Karein</h2>
      <input type="text" id="regUser" placeholder="Assign Username (jaise: amit)" autocomplete="off">
      <input type="text" id="regPass" placeholder="Assign Password (jaise: AMIT@123)" autocomplete="off">
      <button type="button" onclick="createUser()" id="saveBtn">Save Reader Access</button>
    </div>

    <!-- READERS LIST -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2><i class="fa-solid fa-users" style="color:#f59e0b"></i> Active Readers List</h2>
        <button type="button" onclick="loadData()" style="width:auto; padding:6px 12px; font-size:0.75rem; background:#334155;"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </div>
      <div id="statusMsg" style="color:var(--muted); font-size:0.8rem; margin-bottom:10px;">Checking cloud connection...</div>
      <ul class="user-list" id="usersList"></ul>
    </div>
  </div>

  <script>
    const MASTER_PIN = "BLACK@7870ANIX";
    const BIN_ID = "66e0c42dac6210605a222bbe";
    const API_KEY = "$2a$10$1svCQTW76g8kNCCKZHz2je6cHYOHPLEgi1VH//Cs/azPSdvnDW35m";

    let dbRecord = { users: {} };

    function unlockAdmin() {
      const pin = document.getElementById('masterPin').value.trim();
      if (pin === MASTER_PIN) {
        document.getElementById('lockScreen').style.display = 'none';
        loadData();
      } else {
        document.getElementById('pinErr').textContent = "Galat Password!";
        document.getElementById('masterPin').value = '';
      }
    }

    document.getElementById('masterPin').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') unlockAdmin();
    });

    async function loadData() {
      const status = document.getElementById('statusMsg');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${Date.now()}`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const json = await res.json();
        dbRecord = json.record || { users: {} };
        if (!dbRecord.users) dbRecord.users = {};
        status.textContent = "Data synced with Cloud ✅";
        renderUsers();
      } catch (err) {
        status.textContent = "Cloud connection failed.";
      }
    }

    async function pushToCloud(data) {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': API_KEY,
          'X-Bin-Versioning': 'false'
        },
        body: JSON.stringify(data)
      });
      return res.ok;
    }

    async function createUser() {
      const u = document.getElementById('regUser').value.trim().toLowerCase();
      const p = document.getElementById('regPass').value.trim();
      const btn = document.getElementById('saveBtn');
      const status = document.getElementById('statusMsg');

      if (!u || !p) {
        alert("Username aur Password dono bharna zaroori hai!");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Saving to Cloud...";
      status.textContent = "Updating cloud database...";

      try {
        // Fetch fresh copy first
        const fresh = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${Date.now()}`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const freshJson = await fresh.json();
        dbRecord = freshJson.record || { users: {} };
        if (!dbRecord.users) dbRecord.users = {};

        // Add user
        dbRecord.users[u] = {
          password: p,
          locked_ip: null,
          created_at: new Date().toISOString()
        };

        const success = await pushToCloud(dbRecord);
        if (success) {
          document.getElementById('regUser').value = '';
          document.getElementById('regPass').value = '';
          status.textContent = "User permanently saved! ✅";
          renderUsers();
          alert(`User "${u}" ban gaya aur cloud me permanently save ho gaya!`);
        } else {
          alert("Cloud save failed. Master Key verify karein.");
        }
      } catch (e) {
        alert("Internet issue ya cloud save error.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Save Reader Access";
      }
    }

    async function removeUser(u) {
      if (!confirm(`Kya aap "${u}" ko delete karna chahte hain?`)) return;
      delete dbRecord.users[u];
      await pushToCloud(dbRecord);
      renderUsers();
    }

    async function resetDeviceLock(u) {
      if (!confirm(`Kya aap "${u}" ka device/IP lock hatana chahte hain?`)) return;
      if (dbRecord.users[u]) {
        dbRecord.users[u].locked_ip = null;
        await pushToCloud(dbRecord);
        renderUsers();
        alert(`Lock successfully reset ho gaya!`);
      }
    }

    function renderUsers() {
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      const users = Object.keys(dbRecord.users || {});

      if (users.length === 0) {
        list.innerHTML = '<li style="color:var(--muted); font-size:0.85rem;">Koi active reader nahi hai.</li>';
        return;
      }

      users.forEach(u => {
        const item = dbRecord.users[u];
        const isLocked = !!item.locked_ip;
        const li = document.createElement('li');
        li.className = 'user-item';
        li.innerHTML = `
          <div>
            <strong>User: ${u}</strong><br>
            <span style="color:var(--muted); font-size:0.8rem;">Pass: <code>${item.password}</code></span><br>
            ${isLocked 
              ? `<span class="badge badge-locked"><i class="fa-solid fa-lock"></i> Locked IP: ${item.locked_ip}</span>` 
              : `<span class="badge badge-unlocked"><i class="fa-solid fa-lock-open"></i> No Device Locked Yet</span>`}
          </div>
          <div style="display:flex; gap:6px;">
            ${isLocked ? `<button class="reset-btn" onclick="resetDeviceLock('${u}')"><i class="fa-solid fa-rotate"></i> Reset IP</button>` : ''}
            <button class="del-btn" onclick="removeUser('${u}')"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>

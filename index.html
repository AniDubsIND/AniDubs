<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniDubs | Voice Acting & Dubbing Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #07090e;
      --surface: #0f1422;
      --surface-border: rgba(255, 255, 255, 0.08);
      --primary: #ff334b;
      --primary-glow: rgba(255, 51, 75, 0.35);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --gold: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
    body { background-color:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; background-image:radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,51,75,0.15), transparent); }

    /* HEADER */
    header {
      padding:18px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(7, 9, 14, 0.75);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      border-bottom:1px solid var(--surface-border);
      position:sticky;
      top:0;
      z-index:40;
    }
    .brand {
      display:flex;
      align-items:center;
      gap:10px;
      font-family:'Space Grotesk',sans-serif;
      font-size:1.3rem;
      font-weight:700;
      letter-spacing:-0.5px;
      text-decoration:none;
      color:#fff;
    }
    .brand-icon {
      width:36px;
      height:36px;
      border-radius:10px;
      background:linear-gradient(135deg, var(--primary), #fb7185);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 0 15px var(--primary-glow);
      font-size:1rem;
    }
    .admin-link {
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--muted);
      text-decoration:none;
      font-size:0.82rem;
      font-weight:600;
      padding:8px 16px;
      border-radius:100px;
      background:rgba(255,255,255,0.03);
      border:1px solid var(--surface-border);
      transition:all 0.25s ease;
    }
    .admin-link:hover {
      color:#fff;
      border-color:rgba(255,255,255,0.2);
      background:rgba(255,255,255,0.08);
    }

    /* HERO */
    .hero {
      padding:50px 20px 30px;
      text-align:center;
      max-width:720px;
      margin:0 auto;
    }
    .hero-badge {
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 14px;
      border-radius:100px;
      background:rgba(56, 189, 248, 0.1);
      border:1px solid rgba(56, 189, 248, 0.25);
      color:var(--accent);
      font-size:0.75rem;
      font-weight:700;
      letter-spacing:0.5px;
      text-transform:uppercase;
      margin-bottom:18px;
    }
    .hero h1 {
      font-family:'Space Grotesk',sans-serif;
      font-size:2.2rem;
      font-weight:700;
      line-height:1.15;
      margin-bottom:14px;
      letter-spacing:-0.5px;
    }
    .hero h1 span {
      background:linear-gradient(90deg, #ff4655, #38bdf8);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .hero p {
      color:var(--muted);
      font-size:0.95rem;
      line-height:1.6;
      max-width:520px;
      margin:0 auto;
    }
